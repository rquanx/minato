x-minato: &minato
  image: minato:local
  build: .
  env_file: ${MINATO_ENV_FILE:-.env}
  environment: &minato-environment
    MINATO_HOST: 0.0.0.0
    MINATO_CALLBACK_HOST: 0.0.0.0
    MINATO_DATA_PLANE: runtime
    MINATO_RUNTIME_BASE_URL: http://runtime:4300
    MINATO_PROVIDER_RELAY_BASE_URL: http://minato:4100
    MINATO_RUNTIME_TOKEN: ${MINATO_RUNTIME_TOKEN:?Set MINATO_RUNTIME_TOKEN in .env}
    MINATO_RUNTIME_PUBLISH_TOKEN: ${MINATO_RUNTIME_PUBLISH_TOKEN:-${MINATO_RUNTIME_TOKEN}}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minato
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: minato
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "minato", "-d", "minato"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    <<: *minato
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  minato:
    <<: *minato
    environment:
      <<: *minato-environment
      MINATO_AUDIT_JOURNAL: /var/lib/minato/audit.sqlite
    volumes:
      - auditjournal:/var/lib/minato
    ports:
      - "127.0.0.1:${MINATO_PUBLIC_PORT:-8088}:4100"
  runtime:
    image: minato-runtime:local
    build:
      context: ${MINATO_RUNTIME_BUILD_CONTEXT:-./.runtime/litellm-go}
      target: runtime
    env_file: ${MINATO_ENV_FILE:-.env}
    environment:
      LITELLM_GO_MANAGEMENT_API: "false"
      LITELLM_GO_PROVIDER_APIS: "false"
      LITELLM_GO_PORT: "4300"
      LITELLM_MASTER_KEY: ${MINATO_RUNTIME_TOKEN:?Set MINATO_RUNTIME_TOKEN in .env}
      LITELLM_GO_ROUTE_PUBLICATION_TOKEN: ${MINATO_RUNTIME_PUBLISH_TOKEN:-${MINATO_RUNTIME_TOKEN}}
    restart: unless-stopped
volumes:
  pgdata:
  auditjournal:
