x-minato: &minato
  image: minato:local
  build: .
  env_file: ${MINATO_ENV_FILE:-.env}
  environment:
    MINATO_HOST: 0.0.0.0
    MINATO_CALLBACK_HOST: 0.0.0.0
    MINATO_DATA_PLANE: runtime
    MINATO_RUNTIME_BASE_URL: http://runtime:4300
    MINATO_RUNTIME_TOKEN: ${MINATO_RUNTIME_TOKEN:?Set MINATO_RUNTIME_TOKEN in .env}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minato
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: minato
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "minato", "-d", "minato"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    <<: *minato
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  minato:
    <<: *minato
    ports:
      - "127.0.0.1:${MINATO_PUBLIC_PORT:-8088}:4100"
  runtime:
    image: minato-runtime:local
    build:
      context: ../minato-runtime
    env_file: ${MINATO_ENV_FILE:-.env}
    environment:
      MINATO_RUNTIME_PORT: "4300"
      MINATO_RUNTIME_TOKEN: ${MINATO_RUNTIME_TOKEN:?Set MINATO_RUNTIME_TOKEN in .env}
    restart: unless-stopped
volumes:
  pgdata:
