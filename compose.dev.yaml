services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minato
      POSTGRES_USER: minato
      POSTGRES_PASSWORD: minato-dev
    ports:
      - "127.0.0.1:15440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "minato", "-d", "minato"]
      interval: 2s
      timeout: 2s
      retries: 10
volumes:
  pgdata:
